services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sluice_test
      POSTGRES_USER: sluice
      POSTGRES_PASSWORD: sluice
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sluice -d sluice_test"]
      interval: 2s
      timeout: 2s
      retries: 15
