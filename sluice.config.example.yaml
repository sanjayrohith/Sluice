sources:
  - id: github
    provider: github
    secret_env: GITHUB_WEBHOOK_SECRET
    max_body_bytes: 1048576
    destinations: []
  - id: stripe
    provider: stripe
    secret_env: STRIPE_WEBHOOK_SECRET
    dedup_path: $.id
    destinations: []
  - id: razorpay
    provider: razorpay
    secret_env: RAZORPAY_WEBHOOK_SECRET
    dedup_path: $.payload.payment.entity.id
    destinations: []

destinations: []
