sources:
  - id: github
    provider: github
    secret_env: GITHUB_WEBHOOK_SECRET
    max_body_bytes: 1048576
    destinations: []
  - id: stripe
    provider: stripe
    secret_env: STRIPE_WEBHOOK_SECRET
    dedup_path: $.id
    transform: transforms/stripe-invoice-paid.js
    destinations: [billing, analytics]
  - id: razorpay
    provider: razorpay
    secret_env: RAZORPAY_WEBHOOK_SECRET
    dedup_path: $.payload.payment.entity.id
    destinations: []

destinations:
  - id: billing
    url: http://billing:8080/webhooks/stripe
    concurrency: 10
    rps: 20
  - id: analytics
    url: http://analytics:8080/events
    concurrency: 10
    rps: 20
